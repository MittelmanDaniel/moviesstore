{% extends 'base.html' %}
{% block content %}
<section class="container py-4" style="max-width: 680px;">
  <h2 class="mb-3">Create Petition</h2>
  {% if template_data.error %}
    <div class="alert alert-danger">{{ template_data.error }}</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Title</label>
      <input type="text" name="title" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Description (optional)</label>
      <textarea name="description" class="form-control" rows="4"></textarea>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Create</button>
      <a href="{% url 'petitions.index' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
